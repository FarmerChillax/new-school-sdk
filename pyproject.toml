[project]
name = "school-sdk"
version = "1.9.0"
description = "New ZFSoft Python SDK - auto captcha recognition included"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8,<3.14"
authors = [
	{ name = "farmer.chillax", email = "farmer-chong@qq.com" },
]
keywords = ["zfxfzb", "school", "sdk", "education"]
classifiers = [
	"Environment :: Web Environment",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Internet :: WWW/HTTP :: Dynamic Content",
	"Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
	"requests>=2.26.0",
	"pyquery>=1.4.3",
	"bs4>=0.0.1",
	"Pillow>=8.3.1",
	"fake-headers>=1.0.2",
]

[project.optional-dependencies]
# 图形验证码(kaptcha)识别需要 PyTorch, 按需安装: pip install school-sdk[kaptcha]
kaptcha = [
	"torch>=1.10.1",
	"torchvision>=0.11.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["school_sdk", "school_sdk.*"]

[tool.setuptools.package-data]
school_sdk = ["check_code/model.pkl"]

[dependency-groups]
dev = [
	"autopep8==1.5.7",
	"pre-commit>=3",
	"pytest>=7",
]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
# 白名单渐进式启用: 先保持与既有卫生检查等价, lint 规则后续分批放开
select = [
	"W291", # trailing-whitespace
	"W292", # no-newline-at-end-of-file
	"W293", # blank-line-with-whitespace
	"T100", # breakpoint() 残留 (等价原 debug-statements 钩子)
]

[project.urls]
Homepage = "https://github.com/FarmerChillax/new-school-sdk"
Documentation = "https://farmerChillax.github.io/new-school-sdk/"
Repository = "https://github.com/FarmerChillax/new-school-sdk"
Issues = "https://github.com/FarmerChillax/new-school-sdk/issues"
