# 提交前自动检查, 安装钩子: uv run pre-commit install
# 手动全量运行: uv run pre-commit run --all-files
# 紧急跳过(不推荐): git commit --no-verify
repos:
  # 基础文件卫生检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # 仓库内既有 md 文件含刻意的行尾双空格(Markdown 换行), 暂不检查
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
      # model.pkl 约 39 MB, 属于随包分发的二进制权重, 不做检查
      - id: check-added-large-files
        exclude: ^school_sdk/check_code/model\.pkl$
      - id: debug-statements

  # 关键回归: 离线冒烟测试必须全部通过才允许提交
  # system 语言直接复用项目 venv, 避免重复安装依赖; 测试仅需约 0.1s
  - repo: local
    hooks:
      - id: pytest-offline
        name: pytest offline smoke tests
        entry: uv run pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
